[project]
name = "jobpilot-ai"
version = "0.1.0"
description = "Local-first job discovery and AI-assisted evaluation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "google-genai>=1.11,<2.0",
    "playwright>=1.50,<2.0",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.0,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "keyring>=25,<26",
]
notifications = [
    "winotify>=1.1,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]
